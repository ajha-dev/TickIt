# An EXAMPLE production compose: published image, Litestream to S3-compatible
# storage, secrets resolved at run time.
#
# Nothing here is required. `docker run -v tickit-data:/app/data -p 3002:3002
# ghcr.io/ajha-dev/tickit` is a complete install; this file adds backups, a
# healthcheck and log rotation. Copy it and change what does not suit you.
#
# The secrets indirection below assumes the 1Password CLI:
#
#   op run --env-file=.env.tpl -- docker compose -f docker-compose.prod.yml up -d
#
# A plain `.env` file works just as well — see the variable table in README.md.
#
# STORAGE: a named volume. If your host boots from an SD card, consider a bind
# mount onto something better instead — SQLite's write pattern wears flash, and
# named volumes live under /var/lib/docker, wherever that happens to be.
#
# PORTS: 3002 for the app, 9091 for Litestream metrics on loopback only. Change
# either if they collide with something you already run.

services:
  tickit:
    # Pin a tag for a deploy you can roll back. TICKIT_TAG overrides it;
    # :latest is convenient and gives you nothing to roll back to.
    image: ghcr.io/ajha-dev/tickit:${TICKIT_TAG:-latest}
    container_name: tickit
    ports:
      - "${PORT:-3002}:3002"
      # Litestream metrics, loopback only — nothing here should be reachable
      # from the network. Host 9091 to stay clear of a second Litestream on
      # the default 9090; container-side is always 9090.
      - "127.0.0.1:9091:9090"
    volumes:
      - tickit-data:/app/data
    environment:
      # Server
      - HOST=0.0.0.0
      - PORT=3002
      - NODE_ENV=production

      # Database (on the SSD via the bind mount above)
      - DATABASE_PATH=/app/data/tickit.db

      # Reminders / Web Push (optional — leave blank to disable).
      # Without these the server boots normally, logs one line saying reminders
      # are disabled, and GET /api/push/key returns 503, which the client
      # handles with its own copy. Reminders can still be created; they never
      # fire. Generate a pair with: npm run vapid:generate --workspace=server
      #
      # Delivery also needs real HTTPS — `tailscale cert` on the ts.net
      # hostname. Web Push will not work over http:// on a LAN address.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:tickit@localhost}

      # Litestream DB replication to R2 (optional — leave blank to disable)
      - LITESTREAM_REPLICA_BUCKET=${LITESTREAM_REPLICA_BUCKET:-}
      - LITESTREAM_REPLICA_PATH=${LITESTREAM_REPLICA_PATH:-tickit}
      - LITESTREAM_REPLICA_ENDPOINT=${LITESTREAM_REPLICA_ENDPOINT:-}
      - LITESTREAM_REPLICA_REGION=${LITESTREAM_REPLICA_REGION:-auto}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  tickit-data:
