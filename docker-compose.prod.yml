# Production compose for rasphome — published image, Cloudflare R2, secrets
# via 1Password, matching the convention the other apps on that Pi use.
#
# Usage (on the Pi, from ~/tickit):
#   op run --env-file=.env.tpl -- docker compose up -d
#
# STORAGE. An earlier draft of this file bind-mounted /mnt/ssd/tickit, on the
# assumption that the Pi booted from an SD card and had a USB SSD attached for
# data. It does not: rasphome boots from a 238G NVMe drive and has no SD card
# at all, so the root filesystem — and with it /var/lib/docker — is already on
# solid state. A named volume is therefore the right choice and matches
# savethisread beside it. There is no slow, wear-prone card to keep the
# database off.
#
# Ports on this Pi are crowded — 3000 systemic-designer, 3001 savethisread,
# 4000 markdoc, 5432 postgres, 8000 manim-gpt, 9090 savethisread's Litestream
# metrics, 11434 ollama. 3002 and 9091 are free, which is what this uses.

services:
  tickit:
    # Pin to a tag for a deploy you can roll back, as savethisread does
    # (savethisread runs a pinned tag, not :latest). TICKIT_TAG overrides it.
    image: ghcr.io/ajha-dev/tickit:${TICKIT_TAG:-latest}
    container_name: tickit
    ports:
      - "${PORT:-3002}:3002"
      # Litestream metrics. Host port 9091 because savethisread already owns
      # 127.0.0.1:9090 on this Pi. Container-side stays 9090.
      - "127.0.0.1:9091:9090"
    volumes:
      - tickit-data:/app/data
    environment:
      # Server
      - HOST=0.0.0.0
      - PORT=3002
      - NODE_ENV=production

      # Database (on the SSD via the bind mount above)
      - DATABASE_PATH=/app/data/tickit.db

      # Reminders / Web Push (optional — leave blank to disable).
      # Without these the server boots normally, logs one line saying reminders
      # are disabled, and GET /api/push/key returns 503, which the client
      # handles with its own copy. Reminders can still be created; they never
      # fire. Generate a pair with: npm run vapid:generate --workspace=server
      #
      # Delivery also needs real HTTPS — `tailscale cert` on the ts.net
      # hostname. Web Push will not work over http:// on a LAN address.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:tickit@localhost}

      # Litestream DB replication to R2 (optional — leave blank to disable)
      - LITESTREAM_REPLICA_BUCKET=${LITESTREAM_REPLICA_BUCKET:-}
      - LITESTREAM_REPLICA_PATH=${LITESTREAM_REPLICA_PATH:-tickit}
      - LITESTREAM_REPLICA_ENDPOINT=${LITESTREAM_REPLICA_ENDPOINT:-}
      - LITESTREAM_REPLICA_REGION=${LITESTREAM_REPLICA_REGION:-auto}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  tickit-data:
