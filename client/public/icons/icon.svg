<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TickIt">
  <!--
    The app's two primitives, drawn as themselves: a Span (the capsule) and a
    Moment (the dot), on the timeline rail they sit on in the Timeline screen.
    Nothing here is decoration — it is the data model at 16px.

    Deliberately heavy. A vertical mark in a square tile always leaves side
    margin, and two earlier passes read as a thin sliver adrift once a launcher
    added its own padding. The glyph now spans ~78% of the height and the
    capsule is ~27% of the width, which is the point where it stops looking
    lost and starts looking like an icon.
  -->
  <rect width="512" height="512" rx="112" fill="#08090D"/>

  <!-- The rail. Faint: it is what the marks hang on, not a mark itself. -->
  <path d="M256 58V454" stroke="#8E94F2" stroke-opacity="0.3" stroke-width="16" stroke-linecap="round"/>

  <!-- Span: a run of time, with length. -->
  <rect x="187" y="76" width="138" height="216" rx="69" fill="#8E94F2"/>

  <!-- Moment: one instant, no duration. -->
  <circle cx="256" cy="382" r="70" fill="#DAB6FC"/>
</svg>
