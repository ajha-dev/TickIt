<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="TickIt — one tap to log." />

    <!-- Inline so a cold, offline start makes no request at all. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090D'/%3E%3Cpath d='M16 3.6V28.4' stroke='%238E94F2' stroke-opacity='.3' stroke-width='1' stroke-linecap='round'/%3E%3Crect x='11.7' y='4.8' width='8.6' height='13.5' rx='4.3' fill='%238E94F2'/%3E%3Ccircle cx='16' cy='23.9' r='4.4' fill='%23DAB6FC'/%3E%3C/svg%3E"
    />

    <!-- iOS ignores the manifest's icons; without this the home-screen icon is
         a screenshot of the page, which on a near-black app is a black square. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TickIt" />

    <title>TickIt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
