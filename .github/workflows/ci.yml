name: CI/CD

# Check, then build each architecture on its own native runner, then join them
# into one multi-arch manifest. Native runners rather than QEMU because `better-sqlite3`
# is a native module — cross-building it under emulation is slow and is exactly
# the step that would fail quietly.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "client/**"
      - "server/**"
      - "docker/**"
      - "docker-compose*.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "docker/**"
      - "docker-compose*.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Must be lowercase — ghcr rejects capitals in the path.
  IMAGE_NAME: ghcr.io/ajha-dev/tickit

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Both workspaces. Strict mode is on in each, so this catches most of
      # what a review would.
      - name: Typecheck
        run: npm run typecheck

      # The reminder firing rules are pure functions with real assertions
      # behind them — once-per-idle-period, quiet hours that hold rather than
      # cancel, the scheduled staleness window, DST. Getting these wrong means
      # a notification every 60 seconds forever, so they gate the build.
      - name: Reminder rules
        run: npm run test:reminders --workspace=server

      - name: Build
        run: npm run build

  docker-meta:
    name: Docker metadata
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

  build:
    name: Build ${{ matrix.platform }}
    needs: docker-meta
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_tag: amd64
          # The Pi. This is the one that has to work.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_tag: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # No stored secret: GITHUB_TOKEN can push to this repo's own package.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.docker-meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_tag }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Multi-arch manifest
    runs-on: ubuntu-latest
    needs: [docker-meta, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # No stored secret: GITHUB_TOKEN can push to this repo's own package.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ needs.docker-meta.outputs.json }}') \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Summary
        run: |
          echo "### Pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          jq -r '.tags[]' <<< '${{ needs.docker-meta.outputs.json }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploy on the Pi with \`just prod-pull && just prod-up\`." >> $GITHUB_STEP_SUMMARY
