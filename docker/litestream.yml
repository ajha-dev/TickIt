addr: ":9090"
dbs:
  - path: /app/data/tickit.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_REPLICA_BUCKET}
        # HARDCODED, and it must stay that way.
        #
        # This was `${LITESTREAM_REPLICA_PATH:-db}`. Litestream expands only
        # plain ${VAR} — it does NOT understand `:-default` — so the whole
        # token resolved to an EMPTY path and this database replicated to the
        # bucket root, alongside another database sharing that bucket.
        #
        # Writes did not collide (each database gets its own generation id),
        # but RESTORE would have: `litestream restore` takes the newest
        # generation under its path, so restoring TickIt could have pulled
        # the other database into tickit.db — a wrong-data recovery at the
        # exact moment backups matter. Not worth making configurable.
        path: tickit
        endpoint: ${LITESTREAM_REPLICA_ENDPOINT}
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        force-path-style: true
        snapshot-interval: 1h
        # 30 days. This database is tiny (a few thousand rows a year) so the storage cost of a long window is
        # negligible, and the history *is* the product — there is no export and
        # no soft delete, so point-in-time recovery is the only way back from a
        # mis-tapped cascading delete noticed a week later.
        retention: 720h
